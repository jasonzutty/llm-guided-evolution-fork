[project]
name = "llm-guided-evolution"
version = "0.1.0"
description = "llm-guided-evolution, virtual envrionment that includes packages necessary for local llm integration & model evalution."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "accelerate>=0.20.0",
    "aiohttp>=3.8.0",
    "deap==1.4.3",
    "fastapi>=0.100.0",
    "flake8>=7.2.0",
    "furo>=2024.8.6",
    "google-genai>=1.12.1",
    "numpy>=2.0.2",
    "omegaconf>=2.3.0",
    "pytest>=8.3.5",
    "sphinx>=8.2.3",
    "sphinx>=8.2.3",
    "torch==2.6.0",
    "torchvision",
    "transformers",
    "uvicorn",
    "fastapi",
    "accelerate",
    "numpy",
    "pydantic",
    "tqdm",
    "hydra-core==1.3.2",
    "omegaconf",
    "pyyaml",
    "kaggle>=1.7.4.5",
    "pandas>=2.3.2, <3.0.0",
    "scikit-learn>=1.7.2",
    "imblearn",
    "matplotlib",
    "streamlit>=1.58.0",
    "jsonschema",
    "faiss-cpu>=1.7.4",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0", # Text embeddings
    "pymupdf>=1.23.0",            # PDF processing
    "pdfplumber>=0.11.10",
    "vllm == 0.8.5",
]

[tool.pytest.ini_options]
junit_logging = "system-out"
