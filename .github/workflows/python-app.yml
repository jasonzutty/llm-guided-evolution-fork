name: Python application

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"

      - name: Run Python application workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: scripts/workflows/python_app_no_lint.sh
        shell: bash
